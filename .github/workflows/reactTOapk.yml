name: Build Android APK (Responsive & Obfuscated)

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # ক্যাশ সরিয়ে দেওয়া হয়েছে যাতে lock file না থাকলেও এরর না দেয়

      - name: Install Dependencies
        run: npm install

      - name: Build React Project
        run: npm run build

      - name: Obfuscate JavaScript Files
        run: |
          npm install -g javascript-obfuscator
          javascript-obfuscator ./dist/assets --output ./dist/assets --compact true --self-defending true --string-array true --string-array-encoding 'base64' --string-array-threshold 0.75

      - name: Extract App Metadata
        id: meta
        run: |
          APP_NAME=$(jq -r '.appName' assets/app-metadata.json)
          APP_PKG=$(jq -r '.appPackage' assets/app-metadata.json)
          APP_VER=$(jq -r '.versionName' assets/app-metadata.json)
          APP_CODE=$(jq -r '.versionCode' assets/app-metadata.json)
          
          echo "name=$APP_NAME" >> $GITHUB_OUTPUT
          echo "package=$APP_PKG" >> $GITHUB_OUTPUT
          echo "version=$APP_VER" >> $GITHUB_OUTPUT
          echo "code=$APP_CODE" >> $GITHUB_OUTPUT

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Capacitor & Android Platform
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets
          if [ ! -f "capacitor.config.ts" ] && [ ! -f "capacitor.config.json" ]; then
            npx cap init "${{ steps.meta.outputs.name }}" ${{ steps.meta.outputs.package }} --web-dir dist
          fi
          npx cap add android || true
          
      - name: Configure App & Responsive UI
        run: |
          # আইকন জেনারেট
          if [ -f "assets/icon.png" ]; then
            npx capacitor-assets generate --android
          fi

          # AndroidX প্রোপ্রার্টিজ সেটআপ
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          
          # পারমিশন অ্যাড করা
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml

          # ভার্সন আপডেট
          sed -i "s/versionCode [0-9]*/versionCode ${{ steps.meta.outputs.code }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${{ steps.meta.outputs.version }}\"/" android/app/build.gradle
          
          # Kotlin এবং UI লাইব্রেরি ফিক্স
          sed -i '/dependencies {/a \    implementation("androidx.core:core-ktx:1.12.0")\n    constraints {\n        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22")\n        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22")\n    }' android/app/build.gradle

          # MainActivity.java ফাইলটি তৈরি করা (Responsive + Back Button)
          PKG_PATH=$(echo "${{ steps.meta.outputs.package }}" | sed 's/\./\//g')
          mkdir -p "android/app/src/main/java/$PKG_PATH"
          
          cat <<EOF > "android/app/src/main/java/$PKG_PATH/MainActivity.java"
          package ${{ steps.meta.outputs.package }};

          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowManager;
          import android.webkit.WebView;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowInsetsCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
                      Window window = getWindow();
                      window.addFlags(WindowManager.LayoutParams.FLAG_DRAWS_SYSTEM_BAR_BACKGROUNDS);
                      window.setStatusBarColor(Color.TRANSPARENT);
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          window.getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR);
                      }
                  }

                  // Responsive Insets handling
                  View webView = getBridge().getWebView();
                  ViewCompat.setOnApplyWindowInsetsListener(findViewById(android.R.id.content), (v, windowInsets) -> {
                      int statusBarHeight = windowInsets.getInsets(WindowInsetsCompat.Type.statusBars()).top;
                      v.setPadding(0, statusBarHeight, 0, 0);
                      return windowInsets;
                  });
              }

              @Override
              public void onBackPressed() {
                  WebView webView = getBridge().getWebView();
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.name }}-v${{ steps.meta.outputs.version }}
          path: android/app/build/outputs/apk/debug/app-debug.apk

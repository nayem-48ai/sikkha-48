name: Build Android APK (Responsive & Obfuscated)

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Extract App Metadata
        id: meta
        run: |
          APP_NAME=$(jq -r '.appName' assets/app-metadata.json)
          APP_PKG=$(jq -r '.appPackage' assets/app-metadata.json)
          APP_VER=$(jq -r '.versionName' assets/app-metadata.json)
          APP_CODE=$(jq -r '.versionCode' assets/app-metadata.json)
          # Permissions Array রিড করা
          PERMS=$(jq -r '.permissions | join(",")' assets/app-metadata.json)
          
          echo "name=$APP_NAME" >> $GITHUB_OUTPUT
          echo "package=$APP_PKG" >> $GITHUB_OUTPUT
          echo "version=$APP_VER" >> $GITHUB_OUTPUT
          echo "code=$APP_CODE" >> $GITHUB_OUTPUT
          echo "perms=$PERMS" >> $GITHUB_OUTPUT

      - name: Inject Update System into React
        run: |
          # ১. UpdateChecker ডাউনলোড করা
          mkdir -p src/components
          curl -o src/components/UpdateChecker.tsx https://raw.githubusercontent.com/nayem-48ai/sikkha-48/main/components/UpdateChecker.tsx
          
          # ২. App.tsx এ ইম্পোর্ট এবং কম্পোনেন্ট ইনজেক্ট করা
          # যদি ইম্পোর্ট না থাকে তবেই করবে
          if ! grep -q "import UpdateChecker" src/App.tsx; then
            sed -i "1i import UpdateChecker from './components/UpdateChecker';" src/App.tsx
          fi
          
          # Router এর ঠিক নিচে <UpdateChecker /> বসানো
          if ! grep -q "<UpdateChecker />" src/App.tsx; then
            sed -i '/<HashRouter>/a \      <UpdateChecker />' src/App.tsx || sed -i '/<Router>/a \      <UpdateChecker />' src/App.tsx
          fi

      - name: Setup Node & Build
        run: |
          npm install
          npm run build
          npm install -g javascript-obfuscator
          javascript-obfuscator ./dist/assets --output ./dist/assets --compact true --self-defending true

      - name: Setup Java & Capacitor
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Configure Android Project
        run: |
          npx cap add android || true
          
          # ডাইনামিক পারমিশন ইনজেকশন
          IFS=',' read -ra ADDR <<< "${{ steps.meta.outputs.perms }}"
          for i in "${ADDR[@]}"; do
            if ! grep -q "android.permission.$i" android/app/src/main/AndroidManifest.xml; then
              sed -i "/<\/manifest>/i \    <uses-permission android:name=\"android.permission.$i\" />" android/app/src/main/AndroidManifest.xml
            fi
          done

          # ভার্সন আপডেট
          sed -i "s/versionCode [0-9]*/versionCode ${{ steps.meta.outputs.code }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"${{ steps.meta.outputs.version }}\"/" android/app/build.gradle
          
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.name }}-v${{ steps.meta.outputs.version }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
